name: Deploy Backend (API)

on:
  push:
    branches:
      - Master
      - dev

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'Master' && 'production' || 'development' }}

    steps:
      # -------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # DEBUG WORKSPACE (FAIL FAST)
      # -------------------------------------------------
      - name: Debug workspace
        run: |
          pwd
          ls -la
          if [ ! -f package.json ]; then
            echo "❌ package.json NOT found in repo root."
            exit 1
          fi

      # -------------------------------------------------
      # SET ENVIRONMENT VARIABLES
      # -------------------------------------------------
      - name: Setup environment variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "Master" ]]; then
            echo "SERVER_HOST=${{ vars.PROD_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.PROD_SERVER_USER }}" >> $GITHUB_ENV
            echo "API_DIR=/home/${{ vars.PROD_SERVER_USER }}/alaba-marketplace-production/server" >> $GITHUB_ENV
            echo "API_NAME=alabamarketplace-apis" >> $GITHUB_ENV
            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "SERVER_HOST=${{ vars.DEV_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.DEV_SERVER_USER }}" >> $GITHUB_ENV
            echo "API_DIR=${{ vars.DEV_SCRIPT_PATH }}" >> $GITHUB_ENV
            echo "API_NAME=dev-backend" >> $GITHUB_ENV
            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      # -------------------------------------------------
      # SSH SETUP
      # -------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # -------------------------------------------------
      # ENSURE BACKEND DIRECTORY EXISTS
      # -------------------------------------------------
      - name: Ensure backend directory exists
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p $API_DIR"

      # -------------------------------------------------
      # RSYNC BACKEND SOURCE
      # -------------------------------------------------
      - name: Sync backend source
        run: |
          rsync -avz --delete --progress \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            ./ \
            "$SERVER_USER@$SERVER_HOST:$API_DIR/"

      # -------------------------------------------------
      # BUILD & RESTART BACKEND (FINAL FIX)
      # -------------------------------------------------
      - name: Build & restart backend
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "$SERVER_USER@$SERVER_HOST" << EOF
          set -euo pipefail

          # -------------------------------
          # EXPLICIT ENV (CI SAFE)
          # -------------------------------
          export API_DIR="$API_DIR"
          export API_NAME="$API_NAME"

          # -------------------------------
          # VERIFY NODE & NPM
          # -------------------------------
          export PATH=/opt/cpanel/ea-nodejs22/bin:$PATH
          
          node -v
          npm -v

          # -------------------------------
          # ENTER APP DIRECTORY
          # -------------------------------
          cd "\$API_DIR"

          if [ ! -f package.json ]; then
            echo "❌ package.json NOT FOUND in \$API_DIR"
            pwd
            ls -la
            exit 1
          fi

          # -------------------------------
          # BUILD APPLICATION
          # -------------------------------
          npm install --legacy-peer-deps
          npm run build

          # -------------------------------
          # SAFE PM2 RELOAD / START
          # -------------------------------
          if pm2 describe "\$API_NAME" > /dev/null 2>&1; then
            echo "♻️ Reloading PM2 process..."
            pm2 restart "$API_NAME"
          else
            echo "🚀 Starting PM2 process..."
            cd /home/$SERVER_USER
            
            pm2 start ecosystem.config.js --only "$API_NAME"
          fi

          pm2 save
          EOF
