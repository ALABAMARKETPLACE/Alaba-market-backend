name: Deploy Backend (API)

on:
  push:
    branches:
      - Master
      - dev

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'Master' && 'production' || 'development' }}

    steps:
      # -------------------------------------------------
      # CHECKOUT CODE
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # VERIFY BACKEND EXISTS (REPO ROOT)
      # -------------------------------------------------
      - name: Verify backend source
        run: |
          echo "Repo root contents:"
          ls -la
          test -f package.json || (echo "❌ package.json not found at repo root" && exit 1)

      # -------------------------------------------------
      # SET ENVIRONMENT VARIABLES
      # -------------------------------------------------
      - name: Setup environment variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "Master" ]]; then
            echo "SERVER_HOST=${{ vars.PROD_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.PROD_SERVER_USER }}" >> $GITHUB_ENV
            echo "API_DIR=/home/${{ vars.PROD_SERVER_USER }}/alaba-marketplace-production/server" >> $GITHUB_ENV
            echo "API_NAME=alabamarketplace-apis" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "SERVER_HOST=${{ vars.DEV_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.DEV_SERVER_USER }}" >> $GITHUB_ENV
            echo "API_DIR=/home/${{ vars.DEV_SERVER_USER }}/alaba-marketplace/server" >> $GITHUB_ENV
            echo "API_NAME=alabamarketplace-backend" >> $GITHUB_ENV
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      # -------------------------------------------------
      # DEBUG (SAFE)
      # -------------------------------------------------
      - name: Debug environment
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Server: $SERVER_USER@$SERVER_HOST"
          echo "API_DIR: $API_DIR"
          echo "API_NAME: $API_NAME"
          echo "SSH_KEY: ${SSH_KEY:+SET}"

      # -------------------------------------------------
      # SSH SETUP (IDENTICAL TO FRONTEND — CRITICAL FIX)
      # -------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_ed25519
          $SSH_KEY
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # -------------------------------------------------
      # SSH SANITY CHECK (PROVES AUTH WORKS)
      # -------------------------------------------------
      - name: SSH sanity check
        run: |
          ssh -o BatchMode=yes $SERVER_USER@$SERVER_HOST "whoami"

      # -------------------------------------------------
      # RSYNC BACKEND SOURCE
      # -------------------------------------------------
      - name: Sync backend source
        run: |
          rsync -avz --delete --progress \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            ./ \
            "$SERVER_USER@$SERVER_HOST:$API_DIR/"

      # -------------------------------------------------
      # BUILD & RESTART BACKEND
      # -------------------------------------------------
      - name: Build & restart backend
        run: |
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20.19.6

            cd "$API_DIR"

            if [ ! -f .env ]; then
              echo "❌ .env missing in $API_DIR"
              exit 1
            fi

            npm install --legacy-peer-deps
            npm run build

            PM2="$HOME/.nvm/versions/node/v20.19.6/bin/pm2"

            set +e
            $PM2 describe "$API_NAME" > /dev/null 2>&1
            EXISTS=$?
            set -e

            if [ "$EXISTS" -eq 0 ]; then
              echo "Reloading backend..."
              $PM2 reload "$API_NAME" --update-env
            else
              echo "Starting backend..."
              $PM2 start dist/main.js \
                --name "$API_NAME" \
                --cwd "$API_DIR" \
                --node-args="-r dotenv/config"
            fi

            $PM2 save
          EOF
