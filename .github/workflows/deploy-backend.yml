name: Deploy Backend (API)

on:
  push:
    branches:
      - Master
      - dev

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'Master' && 'production' || 'development' }}

    steps:
      # -------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # DEBUG WORKSPACE
      # -------------------------------------------------
      - name: Debug workspace
        run: |
          pwd
          ls -la
          test -f package.json || echo "⚠️ package.json NOT in repo root"

      # -------------------------------------------------
      # SET ENVIRONMENT VARIABLES
      # -------------------------------------------------
      - name: Setup environment variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "Master" ]]; then
            echo "SERVER_HOST=${{ vars.PROD_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.PROD_SERVER_USER }}" >> $GITHUB_ENV
            echo "API_DIR=/home/${{ vars.PROD_SERVER_USER }}/alaba-marketplace-production/server" >> $GITHUB_ENV
            echo "API_NAME=alabamarketplace-apis" >> $GITHUB_ENV
            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "SERVER_HOST=${{ vars.DEV_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.DEV_SERVER_USER }}" >> $GITHUB_ENV
            echo "API_DIR=/home/${{ vars.DEV_SERVER_USER }}/alaba-marketplace/server" >> $GITHUB_ENV
            echo "API_NAME=alabamarketplace-backend" >> $GITHUB_ENV
            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      # -------------------------------------------------
      # SSH SETUP
      # -------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # -------------------------------------------------
      # ENSURE BACKEND DIRECTORY EXISTS
      # -------------------------------------------------
      - name: Ensure backend directory exists
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p $API_DIR"

      # -------------------------------------------------
      # RSYNC BACKEND SOURCE (REPO ROOT)
      # -------------------------------------------------
      - name: Sync backend source
        run: |
          rsync -avz --delete --progress \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            ./ \
            "$SERVER_USER@$SERVER_HOST:$API_DIR/"

      # -------------------------------------------------
      # BUILD & RESTART BACKEND (FINAL)
      # -------------------------------------------------
      - name: Build & restart backend
        run: |
          API_DIR="$API_DIR" API_NAME="$API_NAME" \
          ssh "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20.19.6

            echo "📁 API_DIR is: $API_DIR"
            cd "$API_DIR"

            if [ ! -f package.json ]; then
              echo "❌ package.json NOT FOUND in $API_DIR"
              echo "📂 Contents:"
              ls -la
              exit 1
            fi

            npm install --legacy-peer-deps
            npm run build

            PM2="$HOME/.nvm/versions/node/v20.19.6/bin/pm2"

            set +e
            $PM2 describe "$API_NAME" > /dev/null 2>&1
            EXISTS=$?
            set -e

            if [ "$EXISTS" -eq 0 ]; then
              $PM2 reload "$API_NAME" --update-env
            else
              $PM2 start dist/main.js \
                --name "$API_NAME" \
                --cwd "$API_DIR" \
                --node-args="-r dotenv/config"
            fi

            $PM2 save
          EOF
