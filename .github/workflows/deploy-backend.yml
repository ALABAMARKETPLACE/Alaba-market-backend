name: Deploy Backend (Production API)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync backend source (production)
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            --exclude .gitignore \
            . \
            ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:/home/alabamarketplace_prod_user/alaba-marketplace-production/server/

      - name: Build & restart backend (PM2, no ecosystem)
        run: |
          ssh ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} << 'EOF'
          set -e

          cd /home/alabamarketplace_prod_user/alaba-marketplace-production/server

          npm install --legacy-peer-deps
          npm run build

          PM2="/home/alabamarketplace_prod_user/.nvm/versions/node/v20.19.6/bin/pm2"

          $PM2 delete alabamarketplace-api || true

          $PM2 start dist/main.js \
            --name alabamarketplace-api \
            --env production \
            --node-args="-r dotenv/config"

          $PM2 save
          EOF

