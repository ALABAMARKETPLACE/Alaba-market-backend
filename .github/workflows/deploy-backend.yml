name: Deploy Backend (API)

on:
  push:
    branches:
      - Master
      - dev

jobs:
  # =================================================
  # PRODUCTION DEPLOY (Master)
  # =================================================
  deploy-prod:
    if: github.ref_name == 'Master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment variables (prod)
        run: |
          echo "SERVER_HOST=${{ vars.PROD_SERVER_HOST }}" >> $GITHUB_ENV
          echo "SERVER_USER=${{ vars.PROD_SERVER_USER }}" >> $GITHUB_ENV
          echo "API_DIR=/home/${{ vars.PROD_SERVER_USER }}/alaba-marketplace-production/server" >> $GITHUB_ENV
          echo "API_NAME=alabamarketplace-apis" >> $GITHUB_ENV

          echo "SSH_KEY<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend source
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            ./ \
            "$SERVER_USER@$SERVER_HOST:$API_DIR/"

      - name: Build & restart backend (prod)
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" << EOF
            set -e

            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
            nvm use 20.19.6

            cd "$API_DIR"

            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            npm run build

            PM2="\$HOME/.nvm/versions/node/v20.19.6/bin/pm2"

            set +e
            \$PM2 describe "$API_NAME" > /dev/null 2>&1
            EXISTS=\$?
            set -e

            if [ "\$EXISTS" -eq 0 ]; then
              \$PM2 reload "$API_NAME" --update-env
            else
              \$PM2 start dist/main.js \
                --name "$API_NAME" \
                --cwd "$API_DIR" \
                --node-args="-r dotenv/config"
            fi

            \$PM2 save
          EOF

  # =================================================
  # DEVELOPMENT DEPLOY (dev)
  # =================================================
  deploy-dev:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment variables (dev)
        run: |
          echo "SERVER_HOST=${{ vars.DEV_SERVER_HOST }}" >> $GITHUB_ENV
          echo "SERVER_USER=${{ vars.DEV_SERVER_USER }}" >> $GITHUB_ENV
          echo "API_DIR=/home/${{ vars.DEV_SERVER_USER }}/alaba-marketplace/server" >> $GITHUB_ENV
          echo "API_NAME=alabamarketplace-backend" >> $GITHUB_ENV

          echo "SSH_KEY<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend source
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude .git \
            --exclude .github \
            ./ \
            "$SERVER_USER@$SERVER_HOST:$API_DIR/"

      - name: Build & restart backend (dev)
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" << EOF
            set -e

            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
            nvm use 20.19.6

            cd "$API_DIR"

            npm install --legacy-peer-deps
            npm run build

            PM2="\$HOME/.nvm/versions/node/v20.19.6/bin/pm2"

            set +e
            \$PM2 describe "$API_NAME" > /dev/null 2>&1
            EXISTS=\$?
            set -e

            if [ "\$EXISTS" -eq 0 ]; then
              \$PM2 reload "$API_NAME" --update-env
            else
              \$PM2 start dist/main.js \
                --name "$API_NAME" \
                --cwd "$API_DIR" \
                --node-args="-r dotenv/config"
            fi

            \$PM2 save
          EOF
