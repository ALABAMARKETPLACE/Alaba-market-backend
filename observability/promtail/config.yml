server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: alaba-market-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: alaba-market-backend
          __path__: /var/log/alaba/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            environment: environment
            module: module
            event: event
            gateway: gateway
            timestamp: time
      - labels:
          level:
          service:
          environment:
          module:
          event:
          gateway:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
