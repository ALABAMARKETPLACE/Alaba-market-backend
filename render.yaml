services:
  # Web Service (Backend API)
  - type: web
    name: alaba-marketplace-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_PRODUCTION
        value: 'false'
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: alaba-marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: DELIVERY_COMPANY_SUBSCRIPTION_AMOUNT
        value: 10000
      - key: DELIVERY_COMPANY_FREE_MONTHS
        value: 2
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_PATH
        value: ./uploads
      - key: FRONTEND_URL
        value: '*'
      - key: APP_URL
        value: 'https://alaba-marketplace-api.onrender.com'
    autoDeploy: true
    disk:
      name: alaba-uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: alaba-marketplace-db
    databaseName: alaba_marketplace
    plan: free
    region: oregon
    postgresMajorVersion: '15'
